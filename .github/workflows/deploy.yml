name: Deploy no GitHub Pages

on:
  push:
    branches: [feat/labs]
  workflow_dispatch:

# Permissões exigidas pelo actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Deixa um deploy terminar antes de começar o próximo, sem cancelar o que já roda.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
